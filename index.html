<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rewind Overlay Plus</title>
    <meta name="description" content="Retro Rewind VR and RR Lounge MMR overlay for OBS, in the browser." />
    <meta name="theme-color" content="#09090b" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <!-- The font loads without holding up the page; the system font shows until it arrives. -->
    <link rel="preload" as="style" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="settings.css?v=18" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <a class="brand" href="./">Rewind Overlay <span>Plus</span></a>
        <nav class="nav" id="nav" aria-label="Settings"></nav>
      </aside>

      <header class="topbar">
        <div class="heading">
          <h1 id="title">Player</h1>
          <span class="status" id="status" hidden></span>
        </div>
        <div class="actions">
          <a class="button" id="open" href="#" target="_blank" rel="noopener">Open</a>
          <button class="button primary" id="copy" type="button">Copy link</button>
        </div>
      </header>

      <main class="panel" id="panel">
        <div class="rows" id="rows"></div>
        <button class="link-button" id="reset" type="button">Reset look</button>
      </main>

      <section class="preview" aria-label="Preview">
        <div class="preview-inner">
          <div class="stage">
            <iframe id="preview" title="Overlay preview" allowtransparency="true"></iframe>
            <p class="stage-empty" id="empty"></p>
          </div>
          <p class="note" id="note" role="status"></p>
        </div>
      </section>
    </div>
    <script src="settings.js?v=17"></script>
  </body>
</html>
