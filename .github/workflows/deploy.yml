# Builds the site and publishes it to GitHub Pages. Every 30 minutes it also copies the RR Lounge country and
# division data into public/data (browsers can't read that page) and republishes if it changed.
# Needs Settings > Pages > Source set to "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.data.outputs.changed == 'true' || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh Lounge data
        id: data
        run: |
          python scripts/lounge_data.py
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update Lounge data" && git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.data.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          node-version: 24
          cache: npm
      - name: Check and build
        if: steps.data.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@v3
        if: steps.data.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: out

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
